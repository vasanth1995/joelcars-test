name: Keep Supabase awake

# Free Supabase projects pause after about a week with no activity.
# This pings the database twice a week so the website never goes blank.
on:
  schedule:
    - cron: '17 3 * * 1,4'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        env:
          URL: ${{ vars.VITE_SUPABASE_URL }}
          KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$URL" ] || [ -z "$KEY" ]; then echo "Supabase variables not set"; exit 0; fi
          curl -fsS "$URL/rest/v1/cars?select=id&limit=1" -H "apikey: $KEY" -H "Authorization: Bearer $KEY"
